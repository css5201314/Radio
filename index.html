  <title>Aether · 纯净磨砂随身电台</title>
  <style>
    :root {
      --bg-base: #080911;
      --glass-card: rgba(255, 255, 255, 0.07);
      --glass-card-hover: rgba(255, 255, 255, 0.11);
      --glass-card-active: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-border-subtle: rgba(255, 255, 255, 0.08);
      --glass-inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.22), inset 0 0 20px rgba(255, 255, 255, 0.02);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      --blur-strength: 30px;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #ff6b4a;
      --accent-glow: rgba(255, 107, 74, 0.4);
      --accent-soft: rgba(255, 107, 74, 0.16);
      --dial-bg: rgba(6, 8, 15, 0.82);
      --pill-bg: rgba(255, 255, 255, 0.08);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="crystal"] {
      --bg-base: #0f172a;
      --glass-card: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.22);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.45);
      --accent-soft: rgba(56, 189, 248, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 100dvh Dynamic Viewport Auto-Adaptation */
    html, body {
      width: 100%;
      min-height: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      position: relative;
      transition: background-color 0.4s ease;
    }

    /* Ambient Dynamic Glowing Mesh */
    .ambient-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .mesh-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.5;
      transition: transform 1.2s ease, opacity 0.8s ease, background 0.8s ease;
    }

    .orb-a {
      width: clamp(240px, 45vw, 360px);
      height: clamp(240px, 45vw, 360px);
      background: radial-gradient(circle, #ff6b4a 0%, rgba(255, 107, 74, 0) 70%);
      top: -40px;
      right: -40px;
    }

    .orb-b {
      width: clamp(260px, 50vw, 400px);
      height: clamp(260px, 50vw, 400px);
      background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
      bottom: -60px;
      left: -60px;
    }

    .orb-c {
      width: clamp(180px, 35vw, 280px);
      height: clamp(180px, 35vw, 280px);
      background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
      top: 40%;
      left: 15%;
      opacity: 0.35;
    }

    /* Fluid Responsive Container Shell */
    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      gap: clamp(8px, 1.5vh, 14px);
    }

    /* Top Glass Navigation Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px;
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      transition: all 0.3s ease;
    }

    .live-dot.idle {
      background: var(--text-muted);
      box-shadow: none;
    }

    .live-dot.playing {
      animation: pulseGreen 1.8s infinite;
    }

    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.65; }
    }

    .brand-title {
      font-size: clamp(15px, 4vw, 17px);
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .badge-capsule {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border-subtle);
      color: var(--text-sub);
      font-family: var(--font-mono);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .glass-btn-sm {
      height: clamp(30px, 4.2vh, 34px);
      padding: 0 clamp(9px, 2.5vw, 12px);
      border-radius: 17px;
      border: 1px solid var(--glass-border);
      background: var(--glass-card);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: clamp(11.5px, 3vw, 12.5px);
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(var(--blur-strength)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur-strength)) saturate(180%);
      box-shadow: var(--glass-inner-glow);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .glass-btn-sm:active {
      transform: scale(0.94);
    }

    .glass-btn-sm.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Frosted Glass Receiver Card (Auto Clamped) */
    .receiver-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: clamp(22px, 5vw, 30px);
      padding: clamp(12px, 2vh, 18px) clamp(14px, 4vw, 20px) clamp(12px, 1.8vh, 16px);
      box-shadow: var(--glass-shadow), var(--glass-inner-glow);
      backdrop-filter: blur(var(--blur-strength)) saturate(190%);
      -webkit-backdrop-filter: blur(var(--blur-strength)) saturate(190%);
      display: flex;
      flex-direction: column;
      gap: clamp(9px, 1.5vh, 14px);
      flex-shrink: 0;
    }

    /* Station Title & Vinyl Visual */
    .station-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(10px, 3vw, 16px);
    }

    .station-meta {
      flex: 1;
      min-width: 0;
    }

    .freq-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .freq-num {
      font-family: var(--font-mono);
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 700;
      letter-spacing: -1.2px;
      line-height: 1;
      color: var(--text-main);
    }

    .freq-unit {
      font-family: var(--font-mono);
      font-size: clamp(10.5px, 2.5vw, 12px);
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .station-name {
      font-size: clamp(15.5px, 4.2vw, 18.5px);
      font-weight: 700;
      margin-top: clamp(2px, 0.6vh, 5px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-desc {
      font-size: clamp(11px, 2.8vw, 12px);
      color: var(--text-sub);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Responsive Floating Frosted Vinyl Hub */
    .vinyl-pod {
      position: relative;
      width: clamp(58px, 15vw, 74px);
      height: clamp(58px, 15vw, 74px);
      border-radius: clamp(18px, 4vw, 24px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--glass-inner-glow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .vinyl-disc {
      width: clamp(46px, 12vw, 58px);
      height: clamp(46px, 12vw, 58px);
      border-radius: 50%;
      background: conic-gradient(from 0deg, #12141c, #262a38, #12141c, #262a38, #12141c);
      border: 2px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      animation: spinVinyl 9s linear infinite;
      animation-play-state: paused;
    }

    .vinyl-disc.spinning {
      animation-play-state: running;
    }

    .vinyl-center {
      width: clamp(18px, 4.5vw, 22px);
      height: clamp(18px, 4.5vw, 22px);
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(9px, 2.5vw, 11px);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.45);
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Glass Tuner Scale Window */
    .tuner-glass {
      position: relative;
      background: var(--dial-bg);
      border-radius: 18px;
      padding: clamp(9px, 1.4vh, 12px) clamp(10px, 3vw, 14px) clamp(8px, 1.2vh, 10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0,0,0,0.25);
      cursor: grab;
      touch-action: none;
    }

    .tuner-glass:active {
      cursor: grabbing;
    }

    .tuner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: clamp(9px, 2.4vw, 10px);
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .signal-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      font-weight: 700;
    }

    .visualizer-canvas {
      width: 100%;
      height: clamp(22px, 3.2vh, 30px);
      display: block;
      margin-bottom: 4px;
    }

    .scale-track {
      position: relative;
      height: clamp(20px, 2.8vh, 26px);
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 4px;
    }

    .tick {
      width: 1.5px;
      height: 7px;
      background: rgba(255, 255, 255, 0.24);
      border-radius: 1px;
    }

    .tick.major {
      height: 13px;
      background: rgba(255, 255, 255, 0.65);
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: clamp(8.5px, 2.2vw, 9.5px);
      color: rgba(255, 255, 255, 0.45);
      margin-top: 3px;
      padding: 0 1px;
    }

    .tuner-needle {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 50%;
      width: 2.5px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent), 0 0 4px #fff;
      border-radius: 2px;
      transform: translateX(-50%);
      transition: left 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .tuner-needle::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Primary Player Controls (Fluid Scaling) */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(8px, 2vw, 12px);
      padding-top: 1px;
    }

    .circle-btn {
      width: clamp(38px, 10vw, 44px);
      height: clamp(38px, 10vw, 44px);
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-card);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--glass-inner-glow);
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
      flex-shrink: 0;
    }

    .circle-btn svg {
      width: clamp(17px, 4.5vw, 20px);
      height: clamp(17px, 4.5vw, 20px);
    }

    .circle-btn:active {
      transform: scale(0.9);
    }

    .circle-btn.fav-active {
      color: #f43f5e;
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.18);
    }

    .play-btn-hero {
      width: clamp(54px, 14vw, 64px);
      height: clamp(54px, 14vw, 64px);
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), #ff8a65);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 26px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.4);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      flex-shrink: 0;
    }

    .play-btn-hero svg {
      width: clamp(23px, 6vw, 28px);
      height: clamp(23px, 6vw, 28px);
    }

    .play-btn-hero:active {
      transform: scale(0.92);
    }

    /* Volume Slider */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 2px;
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      background: var(--pill-bg);
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: clamp(16px, 4vw, 18px);
      height: clamp(16px, 4vw, 18px);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      cursor: pointer;
    }

    /* Station List Section (Fully Responsive Flex & Grid) */
    .stations-section {
      flex: 1 1 0;
      min-height: 100px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1vh, 10px);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3px;
      flex-shrink: 0;
    }

    .section-title {
      font-size: clamp(12.5px, 3.4vw, 13.5px);
      font-weight: 700;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .station-count-pill {
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 10px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border-subtle);
      color: var(--text-main);
      font-family: var(--font-mono);
    }

    .add-link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: clamp(12px, 3.2vw, 13px);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Custom Station Cards Grid (Auto Responsive Columns) */
    .station-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: clamp(7px, 2vw, 10px);
      padding-right: 2px;
      padding-bottom: 4px;
      align-content: start;
    }

    .station-list::-webkit-scrollbar {
      width: 3px;
    }

    .station-list::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 3px;
    }

    .station-item {
      position: relative;
      background: var(--glass-card);
      border: 1px solid var(--glass-border-subtle);
      border-radius: clamp(16px, 3.5vw, 20px);
      padding: clamp(10px, 1.8vh, 13px) clamp(11px, 2.8vw, 14px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--glass-inner-glow);
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .station-item:active {
      transform: scale(0.97);
    }

    .station-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 4px 18px rgba(0,0,0,0.3), var(--glass-inner-glow);
    }

    .st-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .st-freq {
      font-family: var(--font-mono);
      font-size: clamp(11.5px, 3vw, 13px);
      font-weight: 700;
      color: var(--accent);
    }

    .delete-station-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .delete-station-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .st-title {
      font-size: clamp(13px, 3.6vw, 14.5px);
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .st-sub {
      font-size: clamp(10.5px, 2.6vw, 11.5px);
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Empty State Card */
    .empty-state {
      grid-column: 1 / -1;
      background: var(--glass-card);
      border: 1px dashed var(--glass-border);
      border-radius: 22px;
      padding: clamp(24px, 4vh, 34px) 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--glass-inner-glow);
    }

    .empty-icon {
      font-size: clamp(30px, 8vw, 38px);
      opacity: 0.85;
    }

    .empty-title {
      font-size: clamp(14.5px, 4vw, 16px);
      font-weight: 700;
      color: var(--text-main);
    }

    .empty-desc {
      font-size: clamp(11.5px, 3vw, 12.5px);
      line-height: 1.5;
      color: var(--text-sub);
      max-width: 270px;
    }

    .empty-btn {
      margin-top: 3px;
      padding: clamp(8px, 1.4vh, 10px) clamp(16px, 4vw, 22px);
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      border: none;

    function isMobileNetwork() {
      if ("connection" in navigator) {
        const conn = navigator.connection;
        if (conn.type === "cellular" || conn.saveData || (conn.effectiveType && conn.effectiveType.includes("2g"))) {
          return true;
        }
      }
      return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    }

    // Fast watchdog: monitor audio progress to auto-heal stream drops on cellular data
    function setupCellularWatchdog() {
      clearInterval(stallWatchdogTimer);
      stallWatchdogTimer = setInterval(() => {
        if (!isPlaying || isReconnecting || stations.length === 0) return;
        
        // If stream is supposed to be playing but has had no audio progress for > 3s
        const now = Date.now();
        if (audioEl.readyState > 0 && !audioEl.paused && (now - lastProgressTime > 3500)) {
          console.warn("Cellular stream stalled, auto-recovering from live edge...");
          quickRecoverStream();
        }
      }, 1000);
    }

    // Instant live-edge reconnection without user intervention
    function quickRecoverStream() {
      if (isReconnecting || stations.length === 0) return;
      isReconnecting = true;
      updatePlaybackVisuals("弱网波动，正在极速重连...", "AUTO HEAL");
      
      const st = stations[currentIndex];
      // Append cache-buster timestamp parameter to jump straight to current live edge

      const separator = liveUrl.includes("?") ? "&" : "?";
      const cleanUrl = liveUrl.replace(/[?&]_t=\d+/, "");
      
      audioEl.src = cleanUrl + separator + "_t=" + Date.now();
      audioEl.load();
      audioEl.play().then(() => {
        isReconnecting = false;
        lastProgressTime = Date.now();
      }).catch(err => {
        isReconnecting = false;
        console.warn("Recover attempt failed:", err);
      });
    }

      lastProgressTime = Date.now();
      retryCount = 0;

    const favBtn = document.getElementById("favBtn");
    const stationList = document.getElementById("stationList");
    const stationCountPill = document.getElementById("stationCountPill");
        const signalText = document.getElementById("signalText");
    const liveDot = document.getElementById("liveDot");
    const volumeSlider = document.getElementById("volumeSlider");
    const sleepBtn = document.getElementById("sleepBtn");
    const sleepLabel = document.getElementById("sleepLabel");
    const themeBtn = document.getElementById("themeBtn");
    const themeLabel = document.getElementById("themeLabel");
    const orbA = document.getElementById("orbA");
    const orbB = document.getElementById("orbB");

    // Build scale ticks (88 to 108 MHz)
    for (let i = 0; i <= 40; i++) {
      const tick = document.createElement("div");
      tick.className = i % 4 === 0 ? "tick major" : "tick";
      scaleTrack.appendChild(tick);
    }

    function saveStations() {
      try {
        localStorage.setItem("aether_qtfm_12_stations", JSON.stringify(stations));
      } catch (e) {}
    }

    // Update Media Session (Lock screen & Dynamic Island)
    function updateMediaSession(st) {
      if (!("mediaSession" in navigator)) return;
      if (!st) {
        navigator.mediaSession.metadata = null;
        return;
      }
      navigator.mediaSession.metadata = new MediaMetadata({
        title: st.name,
        artist: `FM ${st.freq.toFixed(1)} MHz · 随身电台`,
        album: st.genre || "网络广播直播"
      });
      navigator.mediaSession.setActionHandler("play", () => togglePlay(true));
      navigator.mediaSession.setActionHandler("pause", () => togglePlay(false));
      navigator.mediaSession.setActionHandler("previoustrack", () => stepStation(-1));
      navigator.mediaSession.setActionHandler("nexttrack", () => stepStation(1));
    }

    // Update UI
    function updateStationUI() {
      stationCountPill.textContent = `${stations.length} 个电台`;

      if (stations.length === 0) {
        freqDisplay.textContent = "--.-";
        stationTitle.textContent = "纯净磨砂随身电台";
        stationGenre.textContent = "等待添加电台 · 点击右上角「＋ 添加电台」";
        vinylIcon.textContent = "📻";
        tunerNeedle.style.left = "50%";
        favBtn.classList.remove("fav-active");
        favBtn.querySelector("svg").setAttribute("fill", "none");
        renderStationList();
        updateMediaSession(null);
        return;
      }

      if (currentIndex >= stations.length) currentIndex = stations.length - 1;
      const st = stations[currentIndex];
      freqDisplay.textContent = st.freq.toFixed(1);
      stationTitle.textContent = st.name;
      stationGenre.textContent = st.genre || "自定义广播流";
      if (st.logo) {
        const safeLogo = st.logo.replace(/^http:\/\//i, 'https://');
        vinylIcon.innerHTML = `<img src="${safeLogo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.outerHTML='${st.icon || '📻'}'" />`;
      } else {
        vinylIcon.textContent = st.icon || "📻";
      }

      const pct = Math.max(4, Math.min(96, ((st.freq - 88) / 20) * 92 + 4));
      tunerNeedle.style.left = `${pct}%`;

      if (favorites.has(st.id)) {
        favBtn.classList.add("fav-active");
        favBtn.querySelector("svg").setAttribute("fill", "currentColor");
      } else {
        favBtn.classList.remove("fav-active");
        favBtn.querySelector("svg").setAttribute("fill", "none");
      }

      renderStationList();
      updateMediaSession(st);
    }

    // Toggle Play / Pause with Cellular Fast-Start
    async function togglePlay(forceState) {
      if (stations.length === 0) {
        document.getElementById("customModal").classList.add("open");
        return;
      }

      const targetState = typeof forceState === "boolean" ? forceState : !isPlaying;
      const st = stations[currentIndex];

      if (!targetState) {
        isPlaying = false;
        audioEl.pause();
        clearInterval(stallWatchdogTimer);
        updatePlaybackVisuals("已暂停播放", "STANDBY");
        return;
      }

      isPlaying = true;
      isReconnecting = false;
      lastProgressTime = Date.now();
      setupCellularWatchdog();

      const turboStatus = isMobileNetwork() ? "正在建立蜂窝极速通道..." : `正在连接 · ${st.name}...`;
      updatePlaybackVisuals(turboStatus, "FAST CONNECT");

      // Set volume & low-latency cellular source
      audioEl.volume = parseFloat(volumeSlider.value);
      
      // If same source and not errored, simply resume immediately
      if (audioEl.src && audioEl.src.includes(st.streamUrl) && audioEl.readyState >= 2) {
        audioEl.play().catch(() => {});
        return;
      }

      let streamUrl = st.streamUrl;
      if (window.location.protocol === "https:" && streamUrl.startsWith("http://")) {
        streamUrl = streamUrl.replace(/^http:\/\//i, "https://");
      }
      audioEl.src = streamUrl;
      audioEl.load();

      try {
        await audioEl.play();
      } catch (err) {
        if (!isPlaying) return;
        console.warn("Initial play error:", err);
        // Instant retry once for cellular handshake
        setTimeout(() => {
          if (isPlaying && audioEl.paused) {
            audioEl.play().catch(e => {
              updatePlaybackVisuals("连接超时，请确认该流媒体地址有效", "RETRY");
            });
          }
        }, 500);
      }
    }



    function updatePlaybackVisuals(msg, badge) {
      
      signalText.textContent = badge;
      if (isPlaying) {
        vinylDisc.classList.add("spinning");
        liveDot.className = "live-dot playing";
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
      } else {
        vinylDisc.classList.remove("spinning");
        liveDot.className = "live-dot idle";
        playIcon.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
      }
    }

    function selectStation(index) {
      if (stations.length === 0) return;
      currentIndex = (index + stations.length) % stations.length;
      updateStationUI();
      if (isPlaying) {
        togglePlay(true);
      } else {
        togglePlay(true);
      }
    }

    function stepStation(delta) {
      if (stations.length === 0) return;
      selectStation(currentIndex + delta);
    }

    // Render Station Cards Grid
    function renderStationList() {
      stationList.innerHTML = "";
      if (stations.length === 0) {
        stationList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📻</div>
            <div class="empty-title">暂无自定义电台</div>
            <div class="empty-desc">这是一个磨砂质感的纯净空壳，你可以点击下方按钮添加你常听的任意电台流。</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
              <button class="empty-btn" id="restorePresetBtn">📻 立即载入12套电台</button>
              <button class="empty-btn" id="emptyAddBtn" style="background:var(--glass-card);border:1px solid var(--glass-border);">＋ 手动添加</button>
            </div>
          </div>
        `;
        document.getElementById("emptyAddBtn")?.addEventListener("click", () => {
          document.getElementById("customModal").classList.add("open");
        });
        return;
      }

      stations.forEach((st, idx) => {
        const card = document.createElement("div");
        card.className = `station-item ${idx === currentIndex ? "active" : ""}`;
        const logoBadge = st.logo 
          ? `<img src="${st.logo.replace(/^http:\/\//i, 'https://')}" style="width:20px;height:20px;border-radius:6px;object-fit:cover;vertical-align:middle;box-shadow:0 1px 4px rgba(0,0,0,0.3);" onerror="this.outerHTML='${st.icon || '📻'}'" />`
          : `<span style="font-size:14px;">${st.icon || "📻"}</span>`;

        card.innerHTML = `
          <div class="st-top">
            <span class="st-freq">FM ${st.freq.toFixed(1)}</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${logoBadge}
              <button class="delete-station-btn" title="删除该台" data-idx="${idx}">✕</button>
            </div>
          </div>
          <div class="st-title">${st.name}</div>
          <div class="st-sub">${st.genre || "网络广播"}</div>
        `;
        card.addEventListener("click", (e) => {
          if (e.target.closest(".delete-station-btn")) return;
          selectStation(idx);
        });

        // Delete button listener
        const delBtn = card.querySelector(".delete-station-btn");
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteStation(idx);
        });

        stationList.appendChild(card);
      });
    }

    function deleteStation(idx) {
      const target = stations[idx];
      if (!confirm(`确定要移除「${target.name}」吗？`)) return;
      const wasPlayingCurrent = isPlaying && idx === currentIndex;
      stations.splice(idx, 1);
      saveStations();

      if (stations.length === 0) {
        isPlaying = false;
        audioEl.pause();
        currentIndex = 0;
        updatePlaybackVisuals("电台已清空", "STANDBY");
      } else if (currentIndex >= stations.length) {
        currentIndex = stations.length - 1;
        if (wasPlayingCurrent) togglePlay(true);
      } else if (wasPlayingCurrent) {
        togglePlay(true);
      }
      updateStationUI();
    }

    // Interactive Tuner Dial Dragging
    const tunerWindow = document.getElementById("tunerWindow");
    let isDraggingDial = false;

    function handleDialPointer(clientX) {
      if (stations.length === 0) return;
      const rect = tunerWindow.getBoundingClientRect();
      const relX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const targetFreq = 88.0 + relX * 20.0;
      freqDisplay.textContent = targetFreq.toFixed(1);
      tunerNeedle.style.left = `${Math.max(4, Math.min(96, relX * 92 + 4))}%`;

      let bestIdx = 0;
      let minDiff = Infinity;
      stations.forEach((st, idx) => {
        const diff = Math.abs(st.freq - targetFreq);
        if (diff < minDiff) {
          minDiff = diff;
          bestIdx = idx;
        }
      });
      if (bestIdx !== currentIndex && minDiff < 1.4) {
        currentIndex = bestIdx;
        updateStationUI();
        if (isPlaying) togglePlay(true);
      }
    }

    tunerWindow.addEventListener("pointerdown", (e) => {
      isDraggingDial = true;
      tunerWindow.setPointerCapture(e.pointerId);
      handleDialPointer(e.clientX);
    });

    tunerWindow.addEventListener("pointermove", (e) => {
      if (!isDraggingDial) return;
      handleDialPointer(e.clientX);
    });

    tunerWindow.addEventListener("pointerup", () => {
      if (!isDraggingDial) return;
      isDraggingDial = false;
      updateStationUI();
    });

    // Spectrum Visualizer
    const visCanvas = document.getElementById("visCanvas");
    const visCtx = visCanvas.getContext("2d");
    const barCount = 36;
    const barHeights = new Array(barCount).fill(3);

    function renderVisualizer() {
      visCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
      const barWidth = (visCanvas.width - (barCount - 1) * 4) / barCount;
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ff6b4a";

      for (let i = 0; i < barCount; i++) {
        if (isPlaying) {
          const wave = Math.sin(Date.now() / 180 + i * 0.45) * 0.5 + 0.5;
          const jitter = Math.random() * 0.45;
          const target = Math.max(3, Math.min(26, (wave * 0.65 + jitter * 0.35) * 26 * parseFloat(volumeSlider.value)));
          barHeights[i] += (target - barHeights[i]) * 0.25;
        } else {
          barHeights[i] += (3 - barHeights[i]) * 0.15;
        }

        const h = barHeights[i];
        const x = i * (barWidth + 4);
        const y = (visCanvas.height - h) / 2;

        visCtx.fillStyle = isPlaying ? accentColor : "rgba(255,255,255,0.18)";
        visCtx.beginPath();
        visCtx.roundRect(x, y, barWidth, h, 2);
        visCtx.fill();
      }
      requestAnimationFrame(renderVisualizer);
    }
    requestAnimationFrame(renderVisualizer);

    // Event Bindings
    playBtn.addEventListener("click", () => togglePlay());
    prevBtn.addEventListener("click", () => stepStation(-1));
    nextBtn.addEventListener("click", () => stepStation(1));

    favBtn.addEventListener("click", () => {
      if (stations.length === 0) return;
      const st = stations[currentIndex];
      if (favorites.has(st.id)) {
        favorites.delete(st.id);
      } else {
        favorites.add(st.id);
      }
      try {
        localStorage.setItem("aether_favs", JSON.stringify([...favorites]));
      } catch (e) {}
      updateStationUI();
    });

    volumeSlider.addEventListener("input", () => {
      audioEl.volume = parseFloat(volumeSlider.value);
    });

    // Sleep Timer
    const sleepOptions = [0, 15, 30, 60];
    let sleepIdx = 0;
    sleepBtn.addEventListener("click", () => {
      sleepIdx = (sleepIdx + 1) % sleepOptions.length;
      const mins = sleepOptions[sleepIdx];
      if (sleepTimerId) clearTimeout(sleepTimerId);

      if (mins === 0) {
        sleepBtn.classList.remove("active");
        sleepLabel.textContent = "定时";
        
      } else {
        sleepBtn.classList.add("active");
        sleepLabel.textContent = `${mins}分`;
        
        sleepTimerId = setTimeout(() => {
          togglePlay(false);
          sleepIdx = 0;
          sleepBtn.classList.remove("active");
          sleepLabel.textContent = "定时";
          
        }, mins * 60 * 1000);
      }
    });

    // Theme Toggle (Frosted Dark Amber vs Crystal Cyan Glass)
    let isCrystal = false;
    themeBtn.addEventListener("click", () => {
      isCrystal = !isCrystal;
      if (isCrystal) {
        document.documentElement.setAttribute("data-theme", "crystal");
        themeLabel.textContent = "水晶";
        themeBtn.classList.add("active");
        orbA.style.background = "radial-gradient(circle, #38bdf8 0%, rgba(56, 189, 248, 0) 70%)";
        orbB.style.background = "radial-gradient(circle, #818cf8 0%, rgba(129, 140, 248, 0) 70%)";
      } else {
        document.documentElement.removeAttribute("data-theme");
        themeLabel.textContent = "幻境";
        themeBtn.classList.remove("active");
        orbA.style.background = "radial-gradient(circle, #ff6b4a 0%, rgba(255, 107, 74, 0) 70%)";
        orbB.style.background = "radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%)";
      }
    });

    // Modals
    const customModal = document.getElementById("customModal");
    const openAdd = () => customModal.classList.add("open");
    const closeAdd = () => customModal.classList.remove("open");

    document.getElementById("openAddModalBtn").addEventListener("click", openAdd);
    document.getElementById("addHeaderBtn").addEventListener("click", openAdd);
    document.getElementById("closeCustomModal").addEventListener("click", closeAdd);

    // Sample pills click
    document.querySelectorAll(".sample-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        document.getElementById("customName").value = pill.dataset.name;
        document.getElementById("customUrl").value = pill.dataset.url;
        document.getElementById("customFreq").value = pill.dataset.freq;
        document.getElementById("customGenre").value = pill.dataset.genre;
      });
    });

    // Save custom station
    document.getElementById("saveCustomBtn").addEventListener("click", () => {
      const name = document.getElementById("customName").value.trim();
      const url = document.getElementById("customUrl").value.trim();
      const genre = document.getElementById("customGenre").value.trim() || "自定义网络电台";
      let freq = parseFloat(document.getElementById("customFreq").value);
      if (isNaN(freq) || freq < 88.0 || freq > 108.0) {
        freq = +(88.5 + (stations.length * 2.3) % 19).toFixed(1);
      }

      if (!name || !url) {
        alert("请填写电台名称与直播流地址");
        return;
      }

      if (window.location.protocol === "https:" && url.startsWith("http://")) {
        if (!confirm("注意：当前网页部署在 HTTPS 安全协议下，添加 http:// 未加密音频流可能会被苹果 Safari 拦截播放。确定要继续保存吗？")) {
          return;
        }
      }


      const newStation = {
        id: "station-" + Date.now(),
        freq,
        name,
        genre,
        streamUrl: url,
        icon: "📻"
      };

      stations.push(newStation);
      saveStations();

      // Clear inputs
      document.getElementById("customName").value = "";
      document.getElementById("customUrl").value = "";
      document.getElementById("customFreq").value = "";
      document.getElementById("customGenre").value = "";

      closeAdd();
      currentIndex = stations.length - 1;
      updateStationUI();
      togglePlay(true);
    });



    

    
    // Register Service Worker for PWA offline shell
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // Initial render
    updateStationUI();
  </script>
</body>
</html>
