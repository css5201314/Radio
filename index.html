<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FM365网络收音机">
  <meta name="theme-color" content="#0d0f12">
  <title>FM365 网络收音机 Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bg-main: #0a0d14;
      --card-bg: rgba(22, 27, 38, 0.75);
      --accent-blue: #2563eb;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-main);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding-top: calc(var(--safe-top) + 95px);
      padding-bottom: calc(var(--safe-bottom) + 85px);
      min-height: 100vh;
    }
    /* 頂部固定欄 */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(14, 18, 26, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: var(--safe-top);
    }
    .header-content {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #fff;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(37, 99, 235, 0.25);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon-head {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }
    /* 分類導航滑動欄 */
    .cat-bar {
      display: flex;
      gap: 8px;
      padding: 6px 16px 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar {
      display: none;
    }
    .cat-pill {
      flex-shrink: 0;
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: #9ca3af;
      transition: all 0.2s ease;
    }
    .cat-pill.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    /* 電台卡片列表 */
    .station-list {
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 680px;
      margin: 0 auto;
    }
    .station-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }
    .station-card:active {
      transform: scale(0.985);
    }
    .station-card.active {
      background: rgba(37, 99, 235, 0.16);
      border-color: rgba(96, 165, 250, 0.45);
    }
    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .station-card.active .card-icon {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
    }
    .card-meta {
      min-width: 0;
      flex: 1;
    }
    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-card.active .card-title {
      color: #60a5fa;
    }
    .card-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: #9ca3af;
      flex-shrink: 0;
    }
    .card-sub {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .fav-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .fav-btn.is-fav {
      color: #f43f5e;
    }
    /* 聲波條動效 */
    .wave-box {
      display: flex;
      align-items: flex-end;
      height: 18px;
      gap: 2px;
      padding: 0 6px;
    }
    .wave-bar {
      width: 3px;
      background: #3b82f6;
      border-radius: 2px;
      animation: bar-wave 1s ease-in-out infinite alternate;
    }
    @keyframes bar-wave {
      0% { height: 4px; opacity: 0.3; }
      100% { height: 18px; opacity: 1; }
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }

    /* 底部迷你播放條 */
    .mini-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: rgba(15, 20, 30, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px calc(var(--safe-bottom) + 10px) 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mini-player.hidden-player {
      transform: translateY(110%);
    }
    .mini-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .mini-disc {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #60a5fa;
      font-size: 18px;
      flex-shrink: 0;
      position: relative;
    }
    .mini-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      margin-left: 10px;
    }
    .mini-btn {
      border: none;
      background: transparent;
      color: #9ca3af;
      font-size: 17px;
      cursor: pointer;
      padding: 6px;
    }
    .mini-play-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* 全螢幕黑膠彈窗 */
    .full-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #090c13;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 20px);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .full-modal.modal-closed {
      transform: translateY(100%);
    }
    .modal-head {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .disc-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .vinyl {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: #111;
      border: 4px solid #1f2937;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(37, 99, 235, 0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 16s linear infinite;
    }
    .vinyl.paused {
      animation-play-state: paused;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-core {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1d4ed8, #4338ca);
      border: 3px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 26px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .modal-meta {
      text-align: center;
      margin-top: 24px;
      max-width: 85%;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .modal-freq {
      font-size: 13px;
      color: #60a5fa;
      margin-top: 4px;
    }
    .modal-status {
      display: inline-block;
      margin-top: 10px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      color: #9ca3af;
    }
    .modal-controls-box {
      padding: 10px 24px 20px 24px;
    }
    .route-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 20px;
    }
    .route-btn {
      background: none;
      border: none;
      color: #60a5fa;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-btn-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 12px;
    }
    .modal-play-large {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border: none;
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      cursor: pointer;
    }

    /* 彈出提示 Toast */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 60px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background: rgba(20, 24, 33, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 13px;
      padding: 7px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 頂部標頭與分類導航 -->
  <header class="app-header">
    <div class="header-content">
      <div class="brand-box">
        <div class="brand-icon">
          <i class="fa-solid fa-tower-broadcast"></i>
        </div>
        <div class="brand-title">
          FM365 收音机
          <span class="badge">Pro 极速版</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="addStationBtn" class="btn-icon-head" title="添加电台">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button id="exportM3uBtn" class="btn-icon-head" title="导出 M3U">
          <i class="fa-solid fa-download"></i>
        </button>
      </div>
    </div>
    <!-- 分類水平滑動列 -->
    <div class="cat-bar" id="categoryBar"></div>
  </header>

  <!-- 電台列表容器 -->
  <main class="station-list" id="stationList"></main>

  <!-- 底部 Mini 播放控制器 -->
  <footer id="miniPlayer" class="mini-player hidden-player">
    <div class="mini-info" id="miniPlayerInfo">
      <div class="mini-disc">
        <i class="fa-solid fa-radio" id="miniIcon"></i>
      </div>
      <div style="min-width:0; flex:1;">
        <div style="display:flex; align-items:center; gap:6px;">
          <h4 id="miniTitle" style="font-size:14px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">请选择电台</h4>
          <span id="miniTag" class="card-badge" style="background:rgba(37,99,235,0.25); color:#60a5fa;">国家台</span>
        </div>
        <p id="miniStatus" style="font-size:11px; color:#9ca3af; margin-top:2px;">就绪</p>
      </div>
    </div>
    <div class="mini-controls">
      <button id="miniPrevBtn" class="mini-btn"><i class="fa-solid fa-backward-step"></i></button>
      <button id="miniPlayBtn" class="mini-play-btn"><i id="miniPlayIcon" class="fa-solid fa-play" style="margin-left:2px;"></i></button>
      <button id="miniNextBtn" class="mini-btn"><i class="fa-solid fa-forward-step"></i></button>
    </div>
  </footer>

  <!-- 全螢幕黑膠沉浸播放彈窗 -->
  <div id="fullPlayerModal" class="full-modal modal-closed">
    <div class="modal-head">
      <button id="closeFullModalBtn" class="btn-icon-head"><i class="fa-solid fa-chevron-down"></i></button>
      <div style="text-align:center;">
        <div style="font-size:10px; color:#6b7280; letter-spacing:1px;">LIVE STREAMING</div>
        <div id="modalStationGroup" style="font-size:12px; font-weight:600; color:#60a5fa;">国家台</div>
      </div>
      <button id="copyStreamModalBtn" class="btn-icon-head" title="复制直播源"><i class="fa-solid fa-share-nodes"></i></button>
    </div>

    <div class="disc-container">
      <div class="vinyl paused" id="vinylDisc">
        <div class="vinyl-core">
          <i class="fa-solid fa-tower-cell"></i>
        </div>
      </div>
      <div class="modal-meta">
        <h2 id="modalStationTitle" class="modal-title">中国之声</h2>
        <div id="modalStationFreq" class="modal-freq">FM 106.1 MHz</div>
        <span id="modalStreamStatus" class="modal-status">正在连接音频源...</span>
      </div>
    </div>

    <div class="modal-controls-box">
      <div class="route-row">
        <span id="routeInfo"><i class="fa-solid fa-circle-nodes" style="color:#10b981; margin-right:5px;"></i> 主线路 (高速 CDN)</span>
        <button id="switchRouteBtn" class="route-btn">切换备用线路</button>
      </div>
      <div class="modal-btn-row">
        <button id="modalFavBtn" class="mini-btn" style="font-size:22px;"><i class="fa-regular fa-heart"></i></button>
        <button id="modalPrevBtn" class="mini-btn" style="font-size:24px;"><i class="fa-solid fa-backward-step"></i></button>
        <button id="modalPlayBtn" class="modal-play-large"><i id="modalPlayIcon" class="fa-solid fa-play" style="margin-left:3px;"></i></button>
        <button id="modalNextBtn" class="mini-btn" style="font-size:24px;"><i class="fa-solid fa-forward-step"></i></button>
        <button id="modalMuteBtn" class="mini-btn" style="font-size:20px;"><i class="fa-solid fa-volume-high"></i></button>
      </div>
      <div style="text-align:center; font-size:11px; color:#4b5563; margin-top:10px;">
        支持 iOS 锁屏控制 • 息屏常驻保活 • 自动自愈
      </div>
    </div>
  </div>

  <!-- Toast 提示組件 -->
  <div id="toast" class="toast">提示</div>

          "https://lhttp.qtfm.cn/live/1020/64k.mp3"
        ]
      },
      {
        id: "gd-news",
        name: "广东新闻广播",
        category: "地方台",
        freq: "FM 91.4",
        icon: "fa-bullhorn",
        routes: [
          "https://lhttp.qtfm.cn/live/402/64k.mp3"
        ]
      },
      {
        id: "sc-traffic",
        name: "四川交通广播",
        category: "交通台",
        freq: "FM 101.7",
        icon: "fa-road",
        routes: [
          "https://lhttp.qtfm.cn/live/471/64k.mp3"
        ]
      }
    ];

    var stations = [];
    var currentCategory = "全部";
    var currentStationIndex = -1;
    var currentRouteIndex = 0;
    var isPlaying = false;
    var favorites = [];

    try {
      favorites = JSON.parse(localStorage.getItem("fm365_favs") || "[]");
    } catch(e) {
      favorites = [];
    }

    var audio = new Audio();
    audio.preload = "none";
    audio.setAttribute("playsinline", "true");
    audio.setAttribute("webkit-playsinline", "true");
    var hls = null;

    // 保活靜音音軌
    var silentAnchor = new Audio();
    silentAnchor.src = "data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABIADAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA//OEAAAAAAAAAAAAAAAAAAAAAA==";
    silentAnchor.loop = true;
    silentAnchor.volume = 0.01;

    function activateKeepAliveAnchor() {
      if (silentAnchor.paused) {
        silentAnchor.play().catch(function() {});
      }
    }

    // 看門狗自愈
    var watchdogTimer = null;
    var lastPlaybackTime = 0;
    var stalledCounter = 0;

    function startWatchdog() {
      stopWatchdog();
      watchdogTimer = setInterval(function() {
        if (!isPlaying || audio.paused) return;
        var currentTime = audio.currentTime;
        if (currentTime === lastPlaybackTime) {
          stalledCounter++;
          if (stalledCounter >= 4) {
            triggerStreamRecovery();
            stalledCounter = 0;
          }
        } else {
          lastPlaybackTime = currentTime;
          stalledCounter = 0;
        }
      }, 1000);
    }

    function stopWatchdog() {
      if (watchdogTimer) {
        clearInterval(watchdogTimer);
        watchdogTimer = null;
      }
      stalledCounter = 0;
      lastPlaybackTime = 0;
    }

    function triggerStreamRecovery() {
      if (currentStationIndex === -1) return;
      showToast("信号重连自愈中...");
      var st = getActiveStation();
      if (!st) return;
      var nextRoute = (currentRouteIndex + 1) % st.routes.length;
      playStation(currentStationIndex, nextRoute, true);
    }

    function loadStations() {
      var customStations = [];
      try {
        customStations = JSON.parse(localStorage.getItem("fm365_custom") || "[]");
      } catch(e) {
        customStations = [];
      }
      stations = DEFAULT_STATIONS.concat(customStations);
    }

    function getActiveStation() {
      return stations[currentStationIndex] || null;
    }

    function renderCategories() {
      var categories = ["全部", "收藏", "国家台", "音乐台", "地方台", "交通台"];
      var container = document.getElementById("categoryBar");
      if (!container) return;
      container.innerHTML = "";

      categories.forEach(function(cat) {
        var btn = document.createElement("button");
        var isActive = (cat === currentCategory);
        btn.className = "cat-pill" + (isActive ? " active" : "");
        btn.textContent = cat;
        btn.onclick = function() {
          currentCategory = cat;
          renderCategories();
          renderStationList();
        };
        container.appendChild(btn);
      });
    }

    function renderStationList() {
      var container = document.getElementById("stationList");
      if (!container) return;
      container.innerHTML = "";

      var filtered = stations.filter(function(st) {
        if (currentCategory === "全部") return true;
        if (currentCategory === "收藏") return favorites.indexOf(st.id) > -1;
        return st.category === currentCategory;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:50px 0; color:#6b7280; font-size:13px;">该分类下暂无电台</div>';
        return;
      }

      filtered.forEach(function(st) {
        var originalIndex = -1;
        for (var i = 0; i < stations.length; i++) {
          if (stations[i].id === st.id) {
            originalIndex = i;
            break;
          }
        }
        var isCurrent = (originalIndex === currentStationIndex);
        var isFav = favorites.indexOf(st.id) > -1;

        var card = document.createElement("div");
        card.className = "station-card" + (isCurrent ? " active" : "");

        var rightWaveOrIcon = "";
        if (isCurrent && isPlaying) {
          rightWaveOrIcon = '<div class="wave-box"><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span></div>';
        } else {
          rightWaveOrIcon = '<i class="fa-solid fa-circle-play" style="font-size:20px; color:#6b7280;"></i>';
        }

        card.innerHTML = 
          '<div class="card-left">' +
            '<div class="card-icon"><i class="fa-solid ' + (st.icon || 'fa-radio') + '"></i></div>' +
            '<div class="card-meta">' +
              '<div class="card-title-row">' +
                '<div class="card-title">' + st.name + '</div>' +
                '<span class="card-badge">' + st.category + '</span>' +
              '</div>' +
              '<div class="card-sub">' + (st.freq || '网络电台') + ' • ' + st.routes.length + ' 条线路</div>' +
            '</div>' +
          '</div>' +
          '<div class="card-right">' +
            '<button class="fav-btn' + (isFav ? ' is-fav' : '') + '" data-id="' + st.id + '">' +
              '<i class="' + (isFav ? 'fa-solid' : 'fa-regular') + ' fa-heart"></i>' +
            '</button>' +
            '<div style="width:36px; display:flex; align-items:center; justify-content:center;">' + rightWaveOrIcon + '</div>' +
          '</div>';

        card.onclick = function(e) {
          if (e.target.closest(".fav-btn")) return;
          playStation(originalIndex, 0);
        };

        var favBtn = card.querySelector(".fav-btn");
        if (favBtn) {
          favBtn.onclick = function(e) {
            e.stopPropagation();
            toggleFavorite(st.id);
          };
        }

        container.appendChild(card);
      });
    }

    function playStation(index, routeIdx, isRecovery) {
      if (index < 0 || index >= stations.length) return;
      currentStationIndex = index;
      currentRouteIndex = routeIdx || 0;
      var st = stations[index];
      var streamUrl = st.routes[currentRouteIndex];

      activateKeepAliveAnchor();
      showMiniPlayer();
      updatePlayerUI("正在缓冲直播流...", true);

      if (hls) {
        hls.destroy();
        hls = null;
      }

      var isM3U8 = streamUrl.indexOf(".m3u8") > -1;

      if (isM3U8 && !audio.canPlayType("application/vnd.apple.mpegurl") && typeof Hls !== "undefined" && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamUrl);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          audio.play().catch(handlePlayError);
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            handleFallbackRoute();
          }
        });
      } else {
        audio.src = streamUrl;
        audio.load();
        audio.play().catch(handlePlayError);
      }

      isPlaying = true;
      startWatchdog();
      updateMediaSession();
      renderStationList();
      if (!isRecovery) {
        showToast("已切换: " + st.name);
      }
    }

    function togglePlay() {
      if (currentStationIndex === -1 && stations.length > 0) {
        playStation(0, 0);
        return;
      }
      if (audio.paused) {
        activateKeepAliveAnchor();
        audio.play().then(function() {
          isPlaying = true;
          startWatchdog();
          updatePlayerUI("正在直播中", false);
          updateMediaSession();
        }).catch(handlePlayError);
      } else {
        audio.pause();
        isPlaying = false;
        stopWatchdog();
        updatePlayerUI("已暂停", false);
        updateMediaSession();
      }
      renderStationList();
    }

    function handlePlayError() {
      updatePlayerUI("重试线路中...", false);
      handleFallbackRoute();
    }

    function handleFallbackRoute() {
      var st = getActiveStation();
      if (!st) return;
      if (currentRouteIndex + 1 < st.routes.length) {
        currentRouteIndex++;
        showToast("切换至备用线路 " + (currentRouteIndex + 1));
        playStation(currentStationIndex, currentRouteIndex);
      } else {
        showToast("全线路无响应，请稍后再试");
        updatePlayerUI("播放失败，请换台", false);
      }
    }

    function prevStation() {
      if (stations.length === 0) return;
      var nextIdx = currentStationIndex - 1;
      if (nextIdx < 0) nextIdx = stations.length - 1;
      playStation(nextIdx, 0);
    }

    function nextStation() {
      if (stations.length === 0) return;
      var nextIdx = (currentStationIndex + 1) % stations.length;
      playStation(nextIdx, 0);
    }

    function toggleFavorite(id) {
      var idx = favorites.indexOf(id);
      if (idx > -1) {
        favorites.splice(idx, 1);
        showToast("已取消收藏");
      } else {
        favorites.push(id);
        showToast("已加入收藏");
      }
      try {
        localStorage.setItem("fm365_favs", JSON.stringify(favorites));
      } catch(e) {}
      renderStationList();
      updateModalFavIcon();
    }

    function showMiniPlayer() {
      var mini = document.getElementById("miniPlayer");
      if (mini) mini.classList.remove("hidden-player");
    }

    function updatePlayerUI(statusText, isLoading) {
      var st = getActiveStation();
      if (!st) return;

      var miniTitle = document.getElementById("miniTitle");
      var miniTag = document.getElementById("miniTag");
      var miniStatus = document.getElementById("miniStatus");
      var miniPlayIcon = document.getElementById("miniPlayIcon");

      if (miniTitle) miniTitle.textContent = st.name;
      if (miniTag) miniTag.textContent = st.category;
      if (miniStatus) miniStatus.textContent = statusText;
      if (miniPlayIcon) {
        miniPlayIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
      }

      var modalTitle = document.getElementById("modalStationTitle");
      var modalFreq = document.getElementById("modalStationFreq");
      var modalGroup = document.getElementById("modalStationGroup");
      var modalStatus = document.getElementById("modalStreamStatus");
      var routeInfo = document.getElementById("routeInfo");
      var vinylDisc = document.getElementById("vinylDisc");
      var modalPlayIcon = document.getElementById("modalPlayIcon");

      if (modalTitle) modalTitle.textContent = st.name;
      if (modalFreq) modalFreq.textContent = (st.freq || '网络电台') + " • 线路 " + (currentRouteIndex + 1) + "/" + st.routes.length;
      if (modalGroup) modalGroup.textContent = st.category;
      if (modalStatus) modalStatus.textContent = statusText;
      if (routeInfo) {
        routeInfo.innerHTML = '<i class="fa-solid fa-circle-nodes" style="color:#10b981; margin-right:5px;"></i> 线路 ' + (currentRouteIndex + 1) + ' (' + (st.routes[currentRouteIndex].indexOf(".m3u8") > -1 ? 'HLS 高清' : '直连音轨') + ')';
      }

      if (vinylDisc) {
        if (isPlaying && !isLoading) {
          vinylDisc.classList.remove("paused");
        } else {
          vinylDisc.classList.add("paused");
        }
      }

      if (modalPlayIcon) {
        modalPlayIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
      }

      updateModalFavIcon();
    }

    function updateModalFavIcon() {
      var st = getActiveStation();
      var favBtn = document.getElementById("modalFavBtn");
      if (!favBtn) return;
      if (st && favorites.indexOf(st.id) > -1) {
        favBtn.innerHTML = '<i class="fa-solid fa-heart" style="color:#f43f5e;"></i>';
      } else {
        favBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
      }
    }

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.setActionHandler('play', function() { togglePlay(); });
      navigator.mediaSession.setActionHandler('pause', function() { togglePlay(); });
      navigator.mediaSession.setActionHandler('previoustrack', function() { prevStation(); });
      navigator.mediaSession.setActionHandler('nexttrack', function() { nextStation(); });
    }

    function updateMediaSession() {
      if (!('mediaSession' in navigator)) return;
      var st = getActiveStation();
      if (!st) return;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: st.name,
        artist: "FM365 收音机 • " + (st.freq || '实时流'),
        album: st.category + " 直播广播",
        artwork: [
          { src: 'https://cdn-icons-png.flaticon.com/512/3075/3075908.png', sizes: '512x512', type: 'image/png' }
        ]
      });
      navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
    }

    function bindAudioEvents() {
      audio.addEventListener("playing", function() {
        isPlaying = true;
        updatePlayerUI("正在直播中", false);
        updateMediaSession();
      });

      audio.addEventListener("pause", function() {
        if (!audio.seeking) {
          isPlaying = false;
          updatePlayerUI("已暂停", false);
          updateMediaSession();
        }
      });

      audio.addEventListener("waiting", function() {
        updatePlayerUI("缓冲加载中...", true);
      });

      audio.addEventListener("error", function() {
        handlePlaybackError();
      });
    }

    function handlePlaybackError() {
      handleFallbackRoute();
    }

    function bindDomEvents() {
      var miniInfo = document.getElementById("miniPlayerInfo");
      if (miniInfo) {
        miniInfo.onclick = function() {
          var modal = document.getElementById("fullPlayerModal");
          if (modal) modal.classList.remove("modal-closed");
        };
      }

      var miniPlay = document.getElementById("miniPlayBtn");
      if (miniPlay) {
        miniPlay.onclick = function(e) {
          e.stopPropagation();
          togglePlay();
        };
      }

      var miniPrev = document.getElementById("miniPrevBtn");
      if (miniPrev) {
        miniPrev.onclick = function(e) {
          e.stopPropagation();
          prevStation();
        };
      }

      var miniNext = document.getElementById("miniNextBtn");
      if (miniNext) {
        miniNext.onclick = function(e) {
          e.stopPropagation();
          nextStation();
        };
      }

      var closeBtn = document.getElementById("closeFullModalBtn");
      if (closeBtn) {
        closeBtn.onclick = function() {
          var modal = document.getElementById("fullPlayerModal");
          if (modal) modal.classList.add("modal-closed");
        };
      }

      var modalPlay = document.getElementById("modalPlayBtn");
      if (modalPlay) modalPlay.onclick = togglePlay;

      var modalPrev = document.getElementById("modalPrevBtn");
      if (modalPrev) modalPrev.onclick = prevStation;

      var modalNext = document.getElementById("modalNextBtn");
      if (modalNext) modalNext.onclick = nextStation;

      var modalFav = document.getElementById("modalFavBtn");
      if (modalFav) {
        modalFav.onclick = function() {
          var st = getActiveStation();
          if (st) toggleFavorite(st.id);
        };
      }

      var switchBtn = document.getElementById("switchRouteBtn");
      if (switchBtn) {
        switchBtn.onclick = function() {
          var st = getActiveStation();
          if (!st) return;
          currentRouteIndex = (currentRouteIndex + 1) % st.routes.length;
          playStation(currentStationIndex, currentRouteIndex);
        };
      }

      var copyBtn = document.getElementById("copyStreamModalBtn");
      if (copyBtn) {
        copyBtn.onclick = function() {
          var st = getActiveStation();
          if (!st) return;
          var url = st.routes[currentRouteIndex];
          if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(function() {
              showToast("流媒体地址已复制！");
            });
          } else {
            showToast("复制失败");
          }
        };
      }

      var exportBtn = document.getElementById("exportM3uBtn");
      if (exportBtn) {
        exportBtn.onclick = function() {
          var m3u = "#EXTM3U\n";
          stations.forEach(function(st) {
            m3u += "#EXTINF:-1 group-title=\"" + st.category + "\", " + st.name + "\n" + st.routes[0] + "\n";
          });
          var blob = new Blob([m3u], { type: "audio/x-mpegurl" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "FM365_Radio.m3u";
          a.click();
          showToast("已下载 M3U 播放列表");
        };
      }
    }

    function showToast(text) {
      var toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(function() {
        toast.classList.remove("show");
      }, 2000);
    }

    // 立即執行初始化（不等待可能延遲的事件，並在 DOM 加載後再次加固）
    function startApp() {
      loadStations();
      renderCategories();
      renderStationList();
      bindAudioEvents();
      bindDomEvents();
      setupMediaSession();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
